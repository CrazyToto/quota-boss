name: Free models

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download public lists
        run: |
          curl -fsSL --max-time 60 https://models.dev/api.json -o "$RUNNER_TEMP/models-dev.json"
          curl -fsSL --max-time 60 https://openrouter.ai/api/v1/models -o "$RUNNER_TEMP/openrouter.json"
      - name: Check free models
        shell: bash
        run: |
          set -o pipefail
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          status=0
          node bin/quota-boss.js free-models "$RUNNER_TEMP/models-dev.json" "$RUNNER_TEMP/openrouter.json" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
