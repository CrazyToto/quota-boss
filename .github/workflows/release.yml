name: Release

# Publishes to npm when a version tag is pushed. It uses npm trusted publishing (OIDC), so no npm token is stored:
# the package settings on npmjs.com name this repository and this workflow file as the trusted publisher.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'CrazyToto/quota-boss'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag, version and branch
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main." >&2
            exit 1
          fi
          if ! grep -q "^## \[\?$version\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
      - name: Check npm supports trusted publishing
        shell: bash
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1."); process.exit(1); }
          ' "$(npm --version)"
      - name: Check syntax
        shell: bash
        run: for f in bin/*.js install.js scripts/*.js test/*.js; do node --check "$f" || exit 1; done
      - run: node --test
      - name: Publish
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
