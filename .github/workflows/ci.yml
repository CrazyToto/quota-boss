name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check syntax
        shell: bash
        run: for f in bin/*.js install.js scripts/*.js test/*.js; do node --check "$f" || exit 1; done
      - run: node --test
      - name: Packed install lifecycle
        shell: bash
        run: |
          tarball="$(npm pack --silent)"
          isolated="$(node -e 'process.stdout.write(require("node:fs").mkdtempSync(require("node:path").join(require("node:os").tmpdir(), "qb-pack-")))')"
          export HOME="$isolated/home" USERPROFILE="$isolated/home"
          export CLAUDE_CONFIG_DIR="$isolated/claude" CODEX_HOME="$isolated/codex"
          export QUOTA_BOSS_HOME="$isolated/boss" npm_config_cache="$isolated/npm"
          export QUOTA_BOSS_SKIP_MCP=1
          mkdir -p "$HOME" "$CLAUDE_CONFIG_DIR" "$CODEX_HOME" "$QUOTA_BOSS_HOME" "$npm_config_cache"
          npx --yes "./$tarball" --no-mcp
          node "$QUOTA_BOSS_HOME/scripts/quota-boss.js" doctor

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history and files
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
